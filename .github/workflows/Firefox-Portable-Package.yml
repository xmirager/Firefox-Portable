# Firefox 便携版构建
# 实际流程全部在 Gecko-Portable 的可复用工作流里，这里只负责触发条件和参数。
# 需要调整构建逻辑时，请改 https://github.com/xmirager/Gecko-Portable
name: Firefox Portable Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 0 * * *'
      timezone: Asia/Shanghai

# 定时任务和 push 撞在一起时排队执行，避免两个构建抢同一个 Release 标签。
concurrency:
  group: build-firefox
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: xmirager/Gecko-Portable/.github/workflows/build-portable.yml@main
    with:
      browser: firefox
      # 中文版改成 zh-CN
      lang: zh-CN
      release-notes-url: 'https://www.mozilla.org/zh-CN/firefox/{version}/releasenotes/'
